name: cleanup-merged-branches

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Delete merged feature branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete ui/overview-prototype-refresh || true
          git push origin --delete feature/catalog-region-filter || true

      - name: Remove one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-merged-branches.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:dev
